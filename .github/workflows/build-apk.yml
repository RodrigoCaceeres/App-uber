name: Compilar APK

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compilar APK (debug)
        run: ./gradlew assembleDebug --no-daemon

      - name: Renombrar APK
        run: cp app/build/outputs/apk/debug/app-debug.apk AutoPausa.apk

      - name: Subir APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: AutoPausa-apk
          path: AutoPausa.apk

      # Publica el APK en la sección "Releases" del repositorio,
      # para descargarlo fácilmente desde el navegador del teléfono.
      - name: Publicar en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: "AutoPausa — última versión"
          body: |
            APK compilado automáticamente a partir del último código.

            **Instalación:** descarga `AutoPausa.apk` en tu teléfono Android,
            ábrelo y acepta instalar desde orígenes desconocidos si te lo pide.
          files: AutoPausa.apk
